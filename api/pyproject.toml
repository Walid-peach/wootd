[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wootd-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "duckdb>=0.10.0",
    "boto3>=1.34.0",
    "lightgbm>=4.3.0",
    "supabase>=2.4.0",
    "sentry-sdk[fastapi]>=2.0.0",
]
