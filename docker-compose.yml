services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "4321:4321"
    command: sh -c "npm install && npm run dev -- --host"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4321"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
