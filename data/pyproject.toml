[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wootd-data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "pyarrow>=16.0.0",
    "duckdb>=0.10.0",
    "requests>=2.31.0",
    "dbt-duckdb>=1.8.0",
    "lightgbm>=4.3.0",
    "mlflow>=2.12.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "ml"]
