[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wootd-data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "snowflake-connector-python>=3.10.0",
    "dbt-snowflake>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "ml"]
