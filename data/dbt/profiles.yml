wootd:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "wootd_dev.duckdb"
      extensions:
        - httpfs
      settings:
        s3_endpoint: "{{ env_var('R2_ENDPOINT_URL') | replace('https://', '') }}"
        s3_access_key_id: "{{ env_var('R2_ACCESS_KEY_ID') }}"
        s3_secret_access_key: "{{ env_var('R2_SECRET_ACCESS_KEY') }}"
        s3_region: "auto"

    prod:
      type: duckdb
      path: ":memory:"
      extensions:
        - httpfs
      settings:
        s3_endpoint: "{{ env_var('R2_ENDPOINT_URL') | replace('https://', '') }}"
        s3_access_key_id: "{{ env_var('R2_ACCESS_KEY_ID') }}"
        s3_secret_access_key: "{{ env_var('R2_SECRET_ACCESS_KEY') }}"
        s3_region: "auto"
